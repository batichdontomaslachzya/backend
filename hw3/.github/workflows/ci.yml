name: Image Service
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and static checks
        run: make check
      - name: Start complete stack
        run: make up
      - name: Verify image pipeline and authorization
        run: make smoke
      - name: Verify persistence and monitoring
        run: make persistence
      - name: Container logs
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop services
        if: always()
        run: docker compose down
